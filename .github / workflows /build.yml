name: Build APK
on:
  push:
    paths:
      - 'app_project.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Project kholo
        run: unzip -o app_project.zip -d proj
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK banao
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DhruvGamepad-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Release mein daalo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk DhruvGamepad.apk
          gh release create "v${{ github.run_number }}" DhruvGamepad.apk --title "Dhruv Gamepad build ${{ github.run_number }}" --notes "APK download karo"
