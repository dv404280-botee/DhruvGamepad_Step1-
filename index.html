<title>Dhruv Gamepad</title>
<style>
/* Layout: one full-screen landscape controller (600x290 drawing) centred on black. Settings panel sizes each control. */
:root{--bg:#000;--edge:#2F7FD6;--btn:#1E4F8F;--down:#2A5FA8;--pad:#0A111F;--text:#E6E8EE;color-scheme:dark}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pad{width:100%;flex:1;min-height:0;display:block;transform-origin:center center}
#rot{display:none;font-size:13px;color:#B4B2A9;text-align:center;padding:8px 0}
@media (orientation:portrait){#rot{display:block}}
.b{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.b.on{transform:scale(.88);transition-duration:.05s}
.b[data-id="L1"].on,.b[data-id="L2"].on,.b[data-id="R1"].on,.b[data-id="R2"].on{transform:translateY(1.5px) scale(.97)}
.b.on .f{stroke:#8FCBFF}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
#pad.enter .b{animation:pop .6s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#pad{animation:fadein 1.4s ease-out both}
#ui{animation:fadein 1.6s ease-out .5s both}
@keyframes rip{from{opacity:.85;transform:scale(.3)}to{opacity:0;transform:scale(1.7)}}
#rip.go{animation:rip .35s ease-out}
@media (prefers-reduced-motion:reduce){#panel,#gear,.pg{animation:none}#pad.enter .b{animation:none}#rip.go{animation:none}#pad,#ui{animation:none}}
.b.dp.on{transform:none}
.b.dp.on .f{fill:rgba(77,163,255,.2);stroke:none}
#kbbar{animation:slideU .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes slideU{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.knob{}
.stick>circle{transition:stroke .12s}
.stick.held>circle:first-child{stroke:#8FCBFF;filter:drop-shadow(0 0 4px rgba(77,163,255,.6))}
@keyframes pulse{0%,100%{opacity:calc(var(--neon,.2)*.55)}50%{opacity:var(--neon,.2)}}
#pad .neon{animation:pulse 3.2s ease-in-out infinite}
#pad.noneon .neon{display:none}
#pad.nopulse .neon{animation:none;opacity:var(--neon,.2)}
@media (prefers-reduced-motion:reduce){#pad .neon{animation:none;opacity:var(--neon,.2)}}
.f{fill:url(#gBtn);stroke:var(--edge);stroke-width:1.5}
.dp .f{fill:transparent;stroke:none}
.pad{fill:#0B1322;stroke:var(--edge);stroke-width:1.5}
.b.on .f{fill:var(--down)}
.b.on .f[style]{fill:#3A4355}
.b.on .pad{fill:#14274A;stroke:#8FCBFF}
text{font-size:11px;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{fill:#D3D1C7}
.sym{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#ui{position:fixed;top:8px;right:8px;z-index:7;display:flex;gap:6px}
#ui button{background:#0A111F;color:#E6E8EE;border:1px solid #2F7FD6;border-radius:10px;padding:10px 14px;font:14px system-ui,sans-serif;min-height:44px}
#ui svg{display:block;width:20px;height:20px}
@keyframes slideR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes gearIn{from{opacity:0;transform:translateX(34px) scale(.6)}to{opacity:1;transform:none}}
@keyframes ringglow{0%{box-shadow:0 0 0 0 rgba(77,163,255,.75),0 0 14px rgba(77,163,255,.8)}100%{box-shadow:0 0 0 16px rgba(77,163,255,0),0 0 0 rgba(77,163,255,0)}}
#panel{animation:slideR .3s cubic-bezier(.2,.8,.3,1) both}
#gear{animation:gearIn .5s cubic-bezier(.2,1.4,.4,1) both}
#ui button{transition:transform .12s,border-color .12s,background .12s}
#ui button:active,.pg{border-color:#8FCBFF!important;background:#14274A!important}
#ui button:active{transform:scale(.9)}
.pg{animation:ringglow .5s ease-out}
#kbbar input{transition:box-shadow .15s,border-color .15s}
#kbbar input:focus{outline:none;border-color:#8FCBFF;box-shadow:0 0 12px rgba(77,163,255,.7)}
#kbtext{transition:box-shadow .15s,border-color .15s}#kbtext:focus{border-color:#8FCBFF!important;box-shadow:0 0 14px rgba(77,163,255,.85);outline:none}
#panel button:active,#kbbar button:active{background:#14274A;border-color:#8FCBFF;box-shadow:0 0 12px rgba(77,163,255,.7)}
#gear[hidden],#corner[hidden],#panel[hidden]{display:none}
#corner{position:fixed;top:0;right:0;width:72px;height:72px;z-index:7}
#panel{position:fixed;top:60px;right:8px;bottom:8px;width:min(330px,62vw);z-index:6;background:#0D0F14;border:1px solid #2F7FD6;border-radius:14px;padding:12px 14px;overflow-y:auto;touch-action:pan-y;box-sizing:border-box}
#panel h2{margin:0 0 8px;font-size:16px;font-weight:600}
#panel h3{margin:12px 0 4px;font-size:14px;font-weight:600;color:#B4B2A9}
.quick{display:flex;gap:8px;margin-bottom:6px}.quick button{flex:1}.quick #fs{flex:3}
.fx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;font-size:14px}.fxh{flex:1 0 100%}.seg{display:flex;flex:1;gap:4px}.seg button{flex:1;padding:9px 0;border-radius:9px;border:1px solid #2A4A7A;background:#0A111F;color:#cfe3ff;font-size:13px}.seg button.on{background:#1C4C94;border-color:#8FCBFF;color:#fff}.tst{padding:9px 14px;border-radius:9px;border:1px solid #2A4A7A;background:#0A111F;color:#cfe3ff;font-size:13px}.fx input[type=range]{flex:1}
.b.on .f{filter:drop-shadow(0 0 5px #4DA3FF)}
.tg{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}.tg input{width:22px;height:22px;flex:none}
#hideGear{width:100%;margin-top:4px}
#kbopen{width:100%;margin-top:6px}
#kbbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;padding:8px 12px;background:#0A111F;border-top:1px solid #2F7FD6;box-sizing:border-box}
#kbbar[hidden]{display:none}
#kbbar input{flex:1;min-width:0;background:#060910;color:#E6E8EE;border:1px solid #2F7FD6;border-radius:10px;padding:10px 12px;font:16px system-ui,sans-serif;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#kbbar button{background:#0A111F;color:#E6E8EE;border:1px solid #2F7FD6;border-radius:10px;padding:10px 14px;font:14px system-ui,sans-serif}
.hint{margin:6px 0 0;font-size:12px;color:#7FB4F0}
.row{display:grid;grid-template-columns:24px 84px 1fr 44px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #1F232B;font-size:14px}
.row input{width:100%;min-width:0;touch-action:pan-y}
.row.off{opacity:.5}
.row input.vis{width:20px;height:20px;touch-action:manipulation}
.row span.v{text-align:right;color:#B4B2A9;font-variant-numeric:tabular-nums}
#panel .acts{display:flex;gap:8px;margin-top:10px}
#panel button{flex:1;background:#0A111F;color:#E6E8EE;border:1px solid #2F7FD6;border-radius:10px;padding:10px;font:14px system-ui,sans-serif}
</style>

<script>
(function(){
var svg=document.getElementById('pad');
var SZ={},ALL=1,HIDE={};
try{var a=JSON.parse(localStorage.getItem('dgSizes')||'{}');if(a&&typeof a==='object')SZ=a;var g=parseFloat(localStorage.getItem('dgSize'));if(g>=0.5&&g<=1.15)ALL=g;}catch(x){}
var items={};
document.querySelectorAll('.item').forEach(function(el){items[el.dataset.k]=el;});
function save(){try{localStorage.setItem('dgSizes',JSON.stringify(SZ));localStorage.setItem('dgSize',ALL.toFixed(2));}catch(x){}}
function sc(k){var v=SZ[k];return(v>=0.5&&v<=1.5)?v:1;}
function applyItem(k){var el=items[k],cx=+el.dataset.cx,cy=+el.dataset.cy,s=sc(k);el.setAttribute('transform','translate('+cx+' '+cy+') scale('+s+') translate('+(-cx)+' '+(-cy)+')');}
function applyAll(){svg.style.transform='scale('+ALL.toFixed(2)+')';}
Object.keys(items).forEach(applyItem);applyAll();
try{var hh=JSON.parse(localStorage.getItem('dgHidden')||'{}');if(hh&&typeof hh==='object')HIDE=hh;}catch(x){}
function applyVis(k){items[k].style.display=HIDE[k]?'none':'';}
function saveHide(){try{localStorage.setItem('dgHidden',JSON.stringify(HIDE));}catch(x){}}
Object.keys(items).forEach(applyVis);

function toSvg(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
var PR={};
function pressBtn(el,id,down){
 if(down){if(PR[id])return;PR[id]=el;el.classList.add('on');}else{if(!PR[id])return;delete PR[id];el.classList.remove('on');}
 try{window.dispatchEvent(new CustomEvent('dgbtn',{detail:{id:id,down:down}}));}catch(x){}
}
document.querySelectorAll('.b:not(.dp)').forEach(function(el){
 var id=el.getAttribute('data-id');
 el.addEventListener('pointerdown',function(e){e.preventDefault();pressBtn(el,id,true);try{el.setPointerCapture(e.pointerId);}catch(x){}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){el.addEventListener(t,function(){pressBtn(el,id,false);});});
});

document.querySelectorAll('.stick').forEach(function(s){
 var key=s.parentNode.dataset.k,cx=+s.dataset.cx,cy=+s.dataset.cy,knob=s.querySelector('.knob'),id=null;
 var tx=0,ty=0,px=0,py=0,vx=0,vy=0,raf=0,held=false,zz=1;
 function put(){var sc2=held?1.06:1;knob.setAttribute('transform','translate('+(cx+px/zz).toFixed(2)+' '+(cy+py/zz).toFixed(2)+') scale('+sc2+') translate('+(-cx)+' '+(-cy)+')');}
 function draw(){raf=0;
  var K=held?.5:.28,D=held?.5:.66;
  vx=(vx+(tx-px)*K)*D;vy=(vy+(ty-py)*K)*D;px+=vx;py+=vy;
  var still=Math.abs(tx-px)<.03&&Math.abs(ty-py)<.03&&Math.abs(vx)<.03&&Math.abs(vy)<.03;
  if(still){px=tx;py=ty;vx=vy=0;}
  put();
  if(!still||held)raf=requestAnimationFrame(draw);}
 function go(){if(!raf)raf=requestAnimationFrame(draw);}
 function move(e){var z=sc(key),max=12*z,p=toSvg(e),dx=p.x-cx*1,dy=p.y-cy*1;zz=z;
  var d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}
  var r=Math.hypot(dx,dy)/max,c=r<.08?0:Math.pow(r,.9);var q=r>0?c/r:0;tx=dx*q;ty=dy*q;try{window.dispatchEvent(new CustomEvent('dgstick',{detail:{k:key,x:tx/max,y:ty/max}}));}catch(x){}go();}
 function reset(){id=null;held=false;s.classList.remove('held');tx=0;ty=0;try{window.dispatchEvent(new CustomEvent('dgstick',{detail:{k:key,x:0,y:0}}));}catch(x){}go();}
 s.addEventListener('pointerdown',function(e){e.preventDefault();if(id!==null)return;id=e.pointerId;try{s.setPointerCapture(id);}catch(x){}s.classList.add('held');held=true;move(e);});
 s.addEventListener('pointermove',function(e){if(e.pointerId===id)move(e);});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){s.addEventListener(t,function(e){if(e.pointerId===id)reset();});});
});

var BASE=[0,14,24,38];
function sm(d){d=Math.max(d,12);return [Math.round(d*.5),4,Math.round(d*.3),5,Math.round(d*.2)];}

function ctx(){if(!ac){try{var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}catch(x){}}if(ac&&ac.state==='suspended'){try{ac.resume();}catch(x){}}return ac;}
/* teen awaaz style: 0 Crystal (kaanch ki halki ghanti), 1 Naram (thum), 2 Klik (tock) */
function ping(f,d,v,t0){var c=ctx();if(!c||!O.vol)return;
 try{var t=c.currentTime+(t0||0),pk=(O.vol/100)*(v||1),sty=O.snd||0,lp=c.createBiquadFilter(),g=c.createGain(),o=c.createOscillator();
  lp.type='lowpass';
  if(sty===0){lp.frequency.value=5000;o.type='sine';o.frequency.setValueAtTime(f,t);
   g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk*.5,t+.004);g.gain.exponentialRampToValueAtTime(0.0001,t+d*2.4);
   var o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.setValueAtTime(f*2.76,t);
   g2.gain.setValueAtTime(0.0001,t);g2.gain.exponentialRampToValueAtTime(pk*.14,t+.003);g2.gain.exponentialRampToValueAtTime(0.0001,t+d);
   o2.connect(g2);g2.connect(lp);o2.start(t);o2.stop(t+d+.05);}
  else if(sty===1){lp.frequency.value=900;o.type='sine';o.frequency.setValueAtTime(f*.8,t);
   g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(pk*.45,t+.014);g.gain.exponentialRampToValueAtTime(0.0001,t+d*1.8);}
  else{lp.frequency.value=2600;o.type='triangle';o.frequency.setValueAtTime(f*1.4,t);o.frequency.exponentialRampToValueAtTime(f,t+.03);
   g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk*.6,t+.002);g.gain.exponentialRampToValueAtTime(0.0001,t+.07);}
  o.connect(g);g.connect(lp);lp.connect(c.destination);o.start(t);o.stop(t+d*2.4+.05);}catch(x){}}
