<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Dhruv Gamepad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen landscape controller (600x290 drawing) centred on black. Single dark look by design. */
:root{--bg:#000;--body:#20232B;--edge:#5A6070;--btn:#2E323D;--down:#4A5060;--stick:#0F1116;--pad:#14161C;--text:#E6E8EE;--light:#4DA3FF;--tri:#5DCAA5;--cir:#F09595;--cro:#85B7EB;--squ:#ED93B1;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pad{width:100%;flex:1;min-height:0;display:block}
#rot{display:none;font-size:13px;color:#B4B2A9;text-align:center;padding:8px 0}
@media (orientation:portrait){#rot{display:block}}
.b{cursor:pointer}
.f{fill:var(--btn);stroke:var(--edge);stroke-width:1.5}
.dp .f{fill:transparent;stroke:none}
.pad{fill:var(--pad);stroke:var(--edge);stroke-width:1.5}
.b.on .f{fill:var(--down)}
.b.on .pad{fill:#1E222B}
text{font-size:11px;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{fill:#D3D1C7}
.sym{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
</style>
<div id="rot">Turn your phone sideways for the full controller</div>
<svg id="pad" viewBox="0 0 600 290" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Dhruv Gamepad PS5 Edition">
<g class="b" data-id="L2"><rect class="f" x="100" y="4" width="90" height="20" rx="10"/><text x="145" y="14">L2</text></g>
<g class="b" data-id="L1"><rect class="f" x="96" y="26" width="98" height="14" rx="7"/></g>
<g class="b" data-id="R2"><rect class="f" x="410" y="4" width="90" height="20" rx="10"/><text x="455" y="14">R2</text></g>
<g class="b" data-id="R1"><rect class="f" x="406" y="26" width="98" height="14" rx="7"/></g>
<path d="M170,45 C240,28 360,28 430,45 C500,55 540,110 560,190 C575,250 545,280 515,270 C480,260 465,220 430,215 L170,215 C135,220 120,260 85,270 C55,280 25,250 40,190 C60,110 100,55 170,45 Z" fill="#20232B" stroke="#5A6070" stroke-width="2.5"/>
<text x="145" y="33" style="font-size:10px;fill:#8A8D99">L1</text>
<text x="455" y="33" style="font-size:10px;fill:#8A8D99">R1</text>

<g class="b dp" data-id="UP"><rect class="f" x="99" y="73" width="22" height="21"/></g>

<g class="stick" data-cx="385" data-cy="168"><circle cx="385" cy="168" r="34" fill="#14161C" stroke="#5A6070" stroke-width="2"/><g class="knob"><circle cx="385" cy="168" r="23" fill="#0F1116" stroke="#5A6070" stroke-width="1.5"/><circle cx="385" cy="168" r="10" fill="none" stroke="#5A6070" stroke-width="1.5"/></g></g>

</svg>
<script>
(function(){
var svg=document.getElementById('pad');
function toSvg(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
document.querySelectorAll('.b').forEach(function(el){
 el.addEventListener('pointerdown',function(e){e.preventDefault();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(x){}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){el.addEventListener(t,function(){el.classList.remove('on');});});
});
document.querySelectorAll('.stick').forEach(function(s){
 var cx=+s.dataset.cx,cy=+s.dataset.cy,knob=s.querySelector('.knob'),id=null,max=12;
 function move(e){var p=toSvg(e),dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}knob.setAttribute('transform','translate('+dx.toFixed(1)+','+dy.toFixed(1)+')');}
 function reset(){id=null;knob.setAttribute('transform','translate(0,0)');}
 s.addEventListener('pointerdown',function(e){e.preventDefault();if(id!==null)return;id=e.pointerId;try{s.setPointerCapture(id);}catch(x){}move(e);});
 s.addEventListener('pointermove',function(e){if(e.pointerId===id)move(e);});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){s.addEventListener(t,function(e){if(e.pointerId===id)reset();});});
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
})();
</script>
