<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dhruv Gamepad</title>
<style>
/* Layout: one full-screen landscape controller (600x290 drawing) centred on black. Settings panel sizes each control. */
:root{--bg:#000;--edge:#5A6070;--btn:#2E323D;--down:#4A5060;--pad:#14161C;--text:#E6E8EE;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pad{width:100%;flex:1;min-height:0;display:block;transform-origin:center center}
#rot{display:none;font-size:13px;color:#B4B2A9;text-align:center;padding:8px 0}
@media (orientation:portrait){#rot{display:block}}
.b{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .08s ease-out}
.b.on{transform:scale(.93)}
.b.dp.on{transform:none}
.knob{will-change:transform}
.f{fill:url(#gBtn);stroke:var(--edge);stroke-width:1.5}
.dp .f{fill:transparent;stroke:none}
.pad{fill:#1A1D25;stroke:var(--edge);stroke-width:1.5}
.b.on .f{fill:var(--down)}
.b.on .f[style]{fill:#3A4355}
.b.on .pad{fill:#1E222B}
text{font-size:11px;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{fill:#D3D1C7}
.sym{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#ui{position:fixed;top:8px;right:8px;z-index:7;display:flex;gap:6px}
#ui button{background:#14161C;color:#E6E8EE;border:1px solid #5A6070;border-radius:10px;padding:10px 14px;font:14px system-ui,sans-serif;min-height:44px}
#ui svg{display:block;width:20px;height:20px}
#gear[hidden],#corner[hidden],#panel[hidden]{display:none}
#corner{position:fixed;top:0;right:0;width:72px;height:72px;z-index:7}
#panel{position:fixed;top:60px;right:8px;bottom:8px;width:min(330px,62vw);z-index:6;background:#0D0F14;border:1px solid #5A6070;border-radius:14px;padding:12px 14px;overflow-y:auto;touch-action:pan-y;box-sizing:border-box}
#panel h2{margin:0 0 8px;font-size:16px;font-weight:600}
#panel h3{margin:12px 0 4px;font-size:14px;font-weight:600;color:#B4B2A9}
.quick{display:flex;gap:8px;margin-bottom:6px}.quick button{flex:1}.quick #fs{flex:3}
.tg{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}.tg input{width:22px;height:22px;flex:none}
#hideGear{width:100%;margin-top:4px}
.hint{margin:6px 0 0;font-size:12px;color:#8A8D99}
.row{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #1F232B;font-size:14px}
.row input{width:100%;min-width:0;touch-action:pan-y}
.row span.v{text-align:right;color:#B4B2A9;font-variant-numeric:tabular-nums}
#panel .acts{display:flex;gap:8px;margin-top:10px}
#panel button{flex:1;background:#14161C;color:#E6E8EE;border:1px solid #5A6070;border-radius:10px;padding:10px;font:14px system-ui,sans-serif}
</style>
<div id="ui"><button id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="#E6E8EE" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
<div id="corner" hidden></div>
<div id="panel" hidden>
<h2>Settings</h2>
<div class="quick"><button id="fs" type="button">Fullscreen</button><button id="sm" type="button" aria-label="Chhota">&minus;</button><button id="bg" type="button" aria-label="Bada">+</button></div>
<label class="tg"><input type="checkbox" id="vib" checked> Vibration (button dabane par)</label>
<label class="tg"><input type="checkbox" id="awake" checked> Screen on rakho (band na ho)</label>
<button id="hideGear" type="button">Settings icon chhupao</button>
<p class="hint">Chhupane ke baad wapas lane ke liye upar dayein kone mein 3 baar jaldi tap karo.</p>
<h3>Size (har button ka)</h3>
<div id="rows"></div>
<div class="acts"><button id="reset" type="button">Reset</button><button id="close" type="button">Band karo</button></div>
</div>
<div id="rot">Turn your phone sideways for the full controller</div>

<script>
(function(){
var svg=document.getElementById('pad');
var SZ={},ALL=1;
try{var a=JSON.parse(localStorage.getItem('dgSizes')||'{}');if(a&&typeof a==='object')SZ=a;var g=parseFloat(localStorage.getItem('dgSize'));if(g>=0.5&&g<=1.15)ALL=g;}catch(x){}
var items={};
document.querySelectorAll('.item').forEach(function(el){items[el.dataset.k]=el;});
function save(){try{localStorage.setItem('dgSizes',JSON.stringify(SZ));localStorage.setItem('dgSize',ALL.toFixed(2));}catch(x){}}
function sc(k){var v=SZ[k];return(v>=0.5&&v<=1.5)?v:1;}
function applyItem(k){var el=items[k],cx=+el.dataset.cx,cy=+el.dataset.cy,s=sc(k);el.setAttribute('transform','translate('+cx+' '+cy+') scale('+s+') translate('+(-cx)+' '+(-cy)+')');}
function applyAll(){svg.style.transform='scale('+ALL.toFixed(2)+')';}
Object.keys(items).forEach(applyItem);applyAll();

function toSvg(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
document.querySelectorAll('.b').forEach(function(el){
 el.addEventListener('pointerdown',function(e){e.preventDefault();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(x){}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){el.addEventListener(t,function(){el.classList.remove('on');});});
});
document.querySelectorAll('.stick').forEach(function(s){
 var key=s.parentNode.dataset.k,cx=+s.dataset.cx,cy=+s.dataset.cy,knob=s.querySelector('.knob'),id=null;
 function move(e){var z=sc(key),max=12*z,p=toSvg(e),dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}knob.style.transition='none';knob.style.transform='translate('+(dx/z).toFixed(1)+'px,'+(dy/z).toFixed(1)+'px)';}
 function reset(){id=null;knob.style.transition='transform .14s ease-out';knob.style.transform='translate(0px,0px)';}
 s.addEventListener('pointerdown',function(e){e.preventDefault();if(id!==null)return;id=e.pointerId;try{s.setPointerCapture(id);}catch(x){}move(e);});
 s.addEventListener('pointermove',function(e){if(e.pointerId===id)move(e);});
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){s.addEventListener(t,function(e){if(e.pointerId===id)reset();});});
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

var panel=document.getElementById('panel'),rows=document.getElementById('rows');
var LIST=[['ALL','Pura controller'],['L1','L1'],['L2','L2'],['R1','R1'],['R2','R2'],['DP','D-Pad'],['TRI','Triangle'],['CIR','Circle'],['CRO','Cross'],['SQU','Square'],['LS','Left stick'],['RS','Right stick'],['TP','Touchpad'],['PS','PS button'],['MU','Mute'],['CR','Create'],['OP','Options']];
var inputs={};
LIST.forEach(function(r){
 var k=r[0],row=document.createElement('div');row.className='row';
 var lab=document.createElement('label');lab.textContent=r[1];
 var inp=document.createElement('input');inp.type='range';inp.step='5';inp.id='sz-'+k;lab.htmlFor=inp.id;
 if(k==='ALL'){inp.min='50';inp.max='115';}else{inp.min='50';inp.max='150';}
 var v=document.createElement('span');v.className='v';
 function show(){var n=Math.round((k==='ALL'?ALL:sc(k))*100);inp.value=n;v.textContent=n+'%';}
 inp.addEventListener('input',function(){var n=+inp.value/100;if(k==='ALL'){ALL=n;applyAll();}else{SZ[k]=n;applyItem(k);}v.textContent=Math.round(n*100)+'%';save();});
 inputs[k]=show;show();
 row.appendChild(lab);row.appendChild(inp);row.appendChild(v);rows.appendChild(row);
});
function showAll(){Object.keys(inputs).forEach(function(k){inputs[k]();});}
document.getElementById('gear').addEventListener('click',function(){panel.hidden=!panel.hidden;});
document.getElementById('close').addEventListener('click',function(){panel.hidden=true;});
document.getElementById('reset').addEventListener('click',function(){SZ={};ALL=1;Object.keys(items).forEach(applyItem);applyAll();showAll();save();});
document.getElementById('sm').addEventListener('click',function(){ALL=Math.max(0.5,Math.round((ALL-0.05)*100)/100);applyAll();showAll();save();});
document.getElementById('bg').addEventListener('click',function(){ALL=Math.min(1.15,Math.round((ALL+0.05)*100)/100);applyAll();showAll();save();});

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});}).catch(function(){});}
if(window.caches){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});}).catch(function(){});}
var fb=document.getElementById('fs'),el=document.documentElement;
function fsOn(){return document.fullscreenElement||document.webkitFullscreenElement;}
fb.addEventListener('click',function(){
 if(fsOn()){var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)try{x.call(document);}catch(e){}return;}
 var f=el.requestFullscreen||el.webkitRequestFullscreen;
 if(!f){fb.textContent='Fullscreen nahi chalta';return;}
 try{var p=f.call(el);if(p&&p.then){p.then(function(){try{screen.orientation.lock('landscape').catch(function(){});}catch(x){}}).catch(function(){fb.textContent='Fullscreen nahi chalta';});}}catch(x){}
});
function sync(){fb.textContent=fsOn()?'Fullscreen band':'Fullscreen';}
document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);

var O={vib:true,awake:true};
try{var o=JSON.parse(localStorage.getItem('dgOpts')||'{}');if(o.vib===false)O.vib=false;if(o.awake===false)O.awake=false;}catch(x){}
var vibEl=document.getElementById('vib'),awEl=document.getElementById('awake');
vibEl.checked=O.vib;awEl.checked=O.awake;
function saveO(){try{localStorage.setItem('dgOpts',JSON.stringify(O));}catch(x){}}
vibEl.addEventListener('change',function(){O.vib=vibEl.checked;saveO();if(O.vib&&navigator.vibrate)navigator.vibrate(30);});
document.addEventListener('pointerdown',function(e){if(O.vib&&navigator.vibrate&&e.target.closest&&e.target.closest('.b'))navigator.vibrate(15);},true);
var wl=null;
function wake(){if(!O.awake||!navigator.wakeLock||document.visibilityState!=='visible'||wl)return;try{navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}catch(x){}}
function unwake(){if(wl){try{wl.release();}catch(x){}wl=null;}}
awEl.addEventListener('change',function(){O.awake=awEl.checked;saveO();if(O.awake)wake();else unwake();});
document.addEventListener('visibilitychange',wake);document.addEventListener('pointerdown',wake);wake();

var gear=document.getElementById('gear'),corner=document.getElementById('corner'),taps=[];
document.getElementById('hideGear').addEventListener('click',function(){panel.hidden=true;gear.hidden=true;corner.hidden=false;taps=[];});
corner.addEventListener('pointerdown',function(e){e.preventDefault();var t=Date.now();taps=taps.filter(function(x){return t-x<1200;});taps.push(t);if(taps.length>=3){taps=[];gear.hidden=false;corner.hidden=true;}});
})();
</script>
